name: syllivo
description: Syllivo — learn naturally, speak confidently. Offline-first German & Korean.
publish_to: none
version: 4.0.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  go_router: ^14.2.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  sqlite3: any
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/de/
    - assets/content/ko/
    - assets/curriculum/
    - assets/curriculum/de/
    - assets/curriculum/ko/